<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" fill="#0f62fe">
  <!-- IBM 8-bar logo: I, B, M letterforms built from horizontal bars with gaps -->

  <!-- Letter I -->
  <rect x="0"   y="0"   width="60"  height="13" rx="2"/>
  <rect x="12"  y="18"  width="36"  height="13" rx="2"/>
  <rect x="12"  y="36"  width="36"  height="13" rx="2"/>
  <rect x="12"  y="54"  width="36"  height="13" rx="2"/>
  <rect x="12"  y="72"  width="36"  height="13" rx="2"/>
  <rect x="0"   y="90"  width="60"  height="13" rx="2"/>

  <!-- Letter B -->
  <rect x="76"  y="0"   width="60"  height="13" rx="2"/>
  <rect x="76"  y="18"  width="72"  height="13" rx="2"/>
  <rect x="76"  y="36"  width="60"  height="13" rx="2"/>
  <rect x="76"  y="54"  width="72"  height="13" rx="2"/>
  <rect x="76"  y="72"  width="72"  height="13" rx="2"/>
  <rect x="76"  y="90"  width="60"  height="13" rx="2"/>

  <!-- Letter M -->
  <rect x="164" y="0"   width="60"  height="13" rx="2"/>
  <rect x="164" y="18"  width="60"  height="13" rx="2"/>
  <rect x="164" y="36"  width="42"  height="13" rx="2"/>
  <rect x="222" y="36"  width="42"  height="13" rx="2"/>
  <rect x="164" y="54"  width="42"  height="13" rx="2"/>
  <rect x="222" y="54"  width="42"  height="13" rx="2"/>
  <rect x="164" y="72"  width="60"  height="13" rx="2"/>
  <rect x="222" y="72"  width="42"  height="13" rx="2"/>
  <rect x="164" y="90"  width="60"  height="13" rx="2"/>
  <rect x="222" y="90"  width="42"  height="13" rx="2"/>
</svg>
